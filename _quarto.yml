project:
  type: book
  output-dir: _site

book:
  title: "Math 401"
  subtitle: "Non-Riemannian Hypersquares"
  author: "Claudio Gómez-Gonzáles"
  chapters:
    - index.qmd
    - part: "Preliminaries"
      chapters:
        - notes/polytopes.qmd
    - part: "Non-Riemannian Polytopes"
      chapters:
        - notes/hypersquare-geometry.qmd
    - references.qmd
  appendices:
    - part: "Homework"
      contents:
        - homework/hw-0.qmd
        - homework/hw-1.qmd
    - part: "Practice Exams"
      contents:
        - exams/practice-1.qmd
    - part: "Course Materials"
      contents:
        - syllabus/main.qmd
  favicon: favicon.ico
  downloads: [pdf]
  sidebar:
      collapse-level: 1
  page-footer:
    left: "Claudio Gómez-Gonzáles"
    right:
      - icon: globe
      - href: "https://cjgg.me/"

bibliography: references.bib

format:
  # The mathkit extension (_extensions/claudiojacobo/mathkit) provides the
  # theme, the math macros, MathJax settings, and the course filters (blocks,
  # exams and grade tables, homework numbering, …). Only course settings here.
  # Update it with: quarto update claudiojacobo/quarto-extensions/mathkit
  mathkit-html:
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
  mathkit-pdf:
    # Accessible (tagged) PDF: see _quarto-tagged.yml (./build.sh --tagged).
    toc-depth: 2
    documentclass: report
    include-in-header:
      text: |
        \let\oldappendix\appendix
        \renewcommand{\appendix}{
          \oldappendix
          \part*{Appendices}
        }
    geometry:
      - margin = 1in
    fontsize: 11pt
